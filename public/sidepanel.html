<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewReply</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main>
    <header class="row">
      <h1 class="grow">✨ ReviewReply</h1>
      <button id="open-full" type="button" title="Open in a full browser tab">⤢ Full view</button>
      <a href="#" data-open-settings>⚙️ Settings</a>
    </header>

    <div id="left-tip" class="notice tip" hidden>
      <span class="grow">Want this panel on the left? In Chrome, open <b>Settings → Appearance → Side panel</b> and choose <b>Show on left</b>.</span>
      <button id="dismiss-tip" type="button" class="icon" aria-label="Dismiss tip">✕</button>
    </div>

    <div id="setup" class="notice warn" hidden></div>

    <div class="row business">
      <label for="profile">Business</label>
      <select id="profile" class="grow"></select>
    </div>

    <section id="panel-profile" class="stack">
      <div id="profile-empty" class="notice warn" hidden>
        No business profile yet. <a href="#" data-open-settings>Create one in Settings</a>.
      </div>

      <section id="profile-form" class="card">
        <div class="row">
          <h2 class="grow">About the business</h2>
          <span id="profile-saved" class="muted small" aria-live="polite"></span>
        </div>
        <div class="grid">
          <div><label for="p-businessName">Business name</label><input id="p-businessName" data-field="businessName" /></div>
          <div><label for="p-businessType">Type</label><input id="p-businessType" data-field="businessType" placeholder="Bar, Restaurant, Hotel…" /></div>
        </div>
        <label for="p-signature">Signature <small>added at the end of every reply, optional</small></label>
        <input id="p-signature" data-field="signature" placeholder="— The team at …" />
        <label for="p-tone">Tone of voice</label>
        <textarea id="p-tone" data-field="tone" rows="2"></textarea>
        <label for="p-facts">Facts the AI may use <small>hours, complaint email, booking link</small></label>
        <textarea id="p-facts" data-field="facts" rows="5"></textarea>
        <p class="small"><a href="#" data-open-settings>Edit rules and the situations playbook in full Settings →</a></p>
      </section>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
