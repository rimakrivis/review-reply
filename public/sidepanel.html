<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewReply</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="row">
    <h1 class="grow">✨ ReviewReply</h1>
    <a href="#" id="open-settings">Settings</a>
  </header>

  <div id="setup" class="notice warn" hidden></div>

  <label for="profile">Business</label>
  <select id="profile"></select>

  <section class="card">
    <h2>Review</h2>
    <div class="row">
      <div class="grow">
        <label for="name">Reviewer name <small>(optional)</small></label>
        <input id="name" placeholder="e.g. Anna K." autocomplete="off" />
      </div>
      <div>
        <label for="rating">Stars</label>
        <select id="rating">
          <option value="0">Unknown</option>
          <option value="5">★★★★★ 5</option>
          <option value="4">★★★★ 4</option>
          <option value="3">★★★ 3</option>
          <option value="2">★★ 2</option>
          <option value="1">★ 1</option>
        </select>
      </div>
    </div>
    <label for="review">Review text</label>
    <textarea id="review" rows="6" placeholder="Paste the review here, or select it on any page, right-click and choose &quot;Draft a reply to this review&quot;."></textarea>
    <div class="row" style="margin-top:10px">
      <button id="draft" class="primary">✨ Draft reply</button>
      <button id="clear">Clear</button>
    </div>
  </section>

  <div id="error" class="notice error" role="alert" hidden></div>

  <section id="result" class="card" hidden>
    <div class="row">
      <h2 class="grow">Draft</h2>
      <span id="situation" class="badge"></span>
    </div>
    <textarea id="reply" rows="7" aria-label="Draft reply"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="copy" class="primary">Copy</button>
      <button data-v="shorter">Shorter</button>
      <button data-v="warmer">Warmer</button>
      <button data-v="regenerate">Try again</button>
    </div>
    <p class="muted small">Edit if needed, then paste it into Google and post it yourself.</p>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
